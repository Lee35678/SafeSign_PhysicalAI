# 단위 테스트 CI — document/16_통합테스트_KPI_CI.md §3. integration job(docker compose mock)은
# docker-compose.ci.yml·vision stub이 생기면 추가한다(16 §3.2·§7 #8).
name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false            # 한 서비스가 실패해도 나머지 결과는 보이게
      matrix:
        # 서비스별로 나누는 이유는 의존성 충돌(data numpy==1.26 vs vision numpy>=2). data는 테스트가 생기면 추가
        service: [web, actuation, picar, vision, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Dockerfile(python:3.11-slim)과 같게
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: OpenCV 런타임 라이브러리 (vision Dockerfile과 같게)
        if: matrix.service == 'vision'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      # portal은 web의 members.py를 그대로 쓴다 — web 의존성(httpx)과 같다
      - run: pip install -r services/${{ matrix.service }}/requirements-test.txt
      - run: python -m pytest services/${{ matrix.service }} -m "not integration" --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.service }}
          path: report.xml
