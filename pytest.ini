[pytest]
# services/*/tests/ 아래에 같은 이름의 테스트 파일이 여럿 있다(예: actuation·picar 양쪽의
# test_controller.py). 기본 import 모드(prepend)는 파일 basename을 모듈명으로 삼기 때문에
# 저장소 루트에서 `pytest`를 돌리면 두 번째 파일에서 "import file mismatch"로 **수집 자체가
# 중단**된다. importlib 모드는 파일 경로로 모듈을 적재해 이름 충돌이 생기지 않는다.
#   참고: 각 테스트는 sys.path.insert로 자기 서비스의 src/를 잡으므로 서비스 간 격리는 유지된다.
addopts = --import-mode=importlib
testpaths = services
