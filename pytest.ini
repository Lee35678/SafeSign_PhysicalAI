[pytest]
# services/*/tests/ 아래에 같은 이름의 테스트 파일이 여럿 있다(예: actuation·picar 양쪽의
# test_controller.py). 기본 import 모드(prepend)는 파일 basename을 모듈명으로 삼기 때문에
# 저장소 루트에서 `pytest`를 돌리면 두 번째 파일에서 "import file mismatch"로 **수집 자체가
# 중단**된다. importlib 모드는 파일 경로로 모듈을 적재해 이름 충돌이 생기지 않는다.
#   참고: 각 테스트는 sys.path.insert로 자기 서비스의 src/를 잡으므로 서비스 간 격리는 유지된다.
addopts = --import-mode=importlib
testpaths = services
# 기본값은 test_*.py와 *_test.py를 둘 다 수집한다. 뒤쪽 패턴에 걸리는 수동 스크립트
# (scripts/aihand_test.py, scripts/load_test.py, tests/vision_to_command_integration_test.py —
# 실행 중인 서버나 실물을 호출한다)가 import되지 않게 test_*.py만 수집한다.
python_files = test_*.py
# 미구현 명세를 xfail로 걸어 둔 테스트가 구현 뒤 XPASS로 조용히 지나가지 않게 한다.
xfail_strict = true
# hw 마커 테스트는 루트 conftest.py의 --run-hw 옵션을 줘야 실행된다(기본은 건너뜀).
markers =
    unit: 외부 프로세스·네트워크 없이 도는 테스트
    integration: 실행 중인 서비스 또는 docker compose(mock)가 필요한 테스트
    hw: 실물 장치(BLE·모터·서보·LED·CSI 카메라)가 필요한 테스트 — --run-hw 필요
