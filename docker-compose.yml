# 개발 PC mock 통합·CI 전용. 실물 운영·시연은 보드별 네이티브 실행(README §4) — 2026-09-28 결정.
services:
  vision:
    build: ./services/vision
    container_name: safesign-vision
    ports:
      - "8001:8000"
    environment:
      - DB_PATH=/data/db/signdb.sqlite3
      # 비워두면 학습 번들(svm_classifier.joblib)에 기록된 τ·N을 쓴다.
      # .env에서 값을 주면 그 값이 번들을 덮어쓴다(운영 중 급히 조일 때용).
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-}
      - N_FRAMES=${N_FRAMES:-}
      - MOCK_CAMERA=${MOCK_CAMERA:-true}
    volumes:
      - signdb:/data/db
      # Colab에서 학습해 내려받은 svm_classifier.joblib을 여기에 넣으면 재빌드 없이 바로 적용된다
      # (services/vision/models/README.md 참고)
      - ./services/vision/models:/app/models
    # ⚠️ 이 이미지로는 CSI 카메라(Camera Module 3)를 쓸 수 없다 — RPi5에서 장치를 넘겨도 마찬가지.
    # CSI는 picamera2 + Raspberry Pi판 libcamera(둘 다 Raspberry Pi OS apt 전용)가 필요한데 이미지에 없다.
    # MOCK_CAMERA=false로 띄우면 camera.state=error로 버티며 "손 미검출"만 낸다. 실물 vision은 네이티브
    # (services/vision/README.md "RPi5 에서 실행"). 컨테이너화 전제조건: document/16_통합테스트_KPI_CI.md §2.4

  # AI Hand + micro:bit. 실물 배포 시 vision과 같은 Raspberry Pi 5(고정 스테이션)에서 실행된다.
  actuation:
    build: ./services/actuation
    container_name: safesign-actuation
    ports:
      - "8002:8000"
    environment:
      - MOCK_HARDWARE=${MOCK_HARDWARE:-true}
      - MICROBIT_BLE_NAME=${MICROBIT_BLE_NAME:-BBC micro:bit}
    # 실물 micro:bit(BLE)는 RPi5 네이티브로 운영한다(README §4). docker-compose.hw.yml(D-Bus 소켓 마운트)은
    # 미검증·선택 사항이며 시연에 쓰지 않는다.

  # picar 전용 컨트롤러. 실물 배포 시 picar 차체에 탑재된 별도의 Raspberry Pi 4B 8GB에서 실행되며,
  # web과는 Wi-Fi(HTTP)로 통신한다 (02_설계문서 §1-1 — picar가 주행하면 카메라도 함께 이동해버리는
  # 문제 때문에 vision/actuation(RPi5)과 물리적으로 분리했다, 2026-09-18). 로컬 개발에서는 이 docker
  # 네트워크가 그 Wi-Fi 구간을 대신한다.
  picar:
    build: ./services/picar
    container_name: safesign-picar
    ports:
      - "8003:8000"
    environment:
      - MOCK_HARDWARE=${MOCK_HARDWARE:-true}
    # 실물 모터(I2C)/LED(GPIO)는 RPi4B 네이티브로 운영한다(README §4). docker-compose.hw.yml(/dev/i2c-1·/dev/gpiochip0
    # 매핑)은 미검증·선택 사항이며 시연에 쓰지 않는다.

  web:
    build: ./services/web
    container_name: safesign-web
    ports:
      - "8000:8000"
    environment:
      - VISION_URL=http://vision:8000
      - ACTUATION_URL=http://actuation:8000
      - PICAR_URL=http://picar:8000
      - PICAR_TIMEOUT_MS=${PICAR_TIMEOUT_MS:-500}
      # 회원·학습 결과 저장 (services/web/supabase/README.md). 비어 있으면 로컬 모드 — 키는 루트 .env에만 둔다
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - MEMBER_DATA_DIR=/data/web
    volumes:
      - signdb:/data/db
      - webdata:/data/web
    depends_on:
      - vision
      - actuation
      - picar

  data-tools:
    build: ./services/data
    container_name: safesign-data-tools
    profiles: ["tools"]
    environment:
      - DB_PATH=/data/db/signdb.sqlite3
      - PROCESSED_DIR=/data/datasets/processed
    volumes:
      - signdb:/data/db
      - ./services/data/datasets:/data/datasets

volumes:
  signdb:
  webdata:
