<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1600, height=900" />
<title>SafeSign 판정 화면 재현</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/hand-data.js"></script>
<style>
@font-face { font-family: "SUIT Variable"; src: url("assets/SUIT-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "JetBrains Mono"; src: url("assets/JetBrainsMono-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "JetBrains Mono"; src: url("assets/JetBrainsMono-700.woff2") format("woff2"); font-weight: 700; }
:root {
  --bg: #0D1217; --panel: #121820; --raised: #18202A; --feed: #0A0E12;
  --line: rgba(148,163,184,.12); --line-2: rgba(148,163,184,.22);
  --text: #F1F5F9; --text-2: #94A3B8; --steel: #64748B; --bone: #E2E8F0;
  --orange: #F97316; --orange-deep: #EA580C; --on-orange: #0F172A;
  --green: #22C55E;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); }
body { color: var(--text); font-family: "SUIT Variable", sans-serif; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
.mono { font-family: "JetBrains Mono", monospace; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
.stage { position: absolute; inset: 0; }

/* 상단 상태 스트립 */
.top { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--line); background: #0B1015; }
.logo { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 2px; }
.logo i { display: inline-block; width: 7px; height: 7px; background: var(--orange); }
.logo-sub { margin-left: 14px; font-size: 15px; color: var(--text-2); font-weight: 600; }
.steps { margin: 0 auto; display: flex; gap: 26px; font-size: 15px; color: var(--text-2); font-weight: 600; }
.steps .on { color: var(--text); position: relative; }
.steps .on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -21px; height: 3px; background: var(--orange); }
.status { display: flex; height: 64px; }
.cell { display: flex; flex-direction: column; justify-content: center; padding: 0 18px; border-left: 1px solid var(--line); font-size: 13px; color: var(--text-2); line-height: 1.35; font-weight: 600; }
.cell b { color: var(--text); font-weight: 700; font-size: 14px; }
.cell.clock { font-size: 20px; color: var(--text); font-weight: 700; }

/* 신호 머리 */
.head { position: absolute; left: 40px; right: 40px; top: 88px; height: 104px; border-bottom: 1px solid var(--line); }
.pos { position: absolute; left: 0; top: 0; font-size: 16px; color: var(--text-2); font-weight: 600; }
.posbox { position: relative; display: inline-block; width: 14px; height: 20px; vertical-align: top; margin-left: 4px; }
.posbox span { color: var(--text); font-weight: 800; }
.pos .of { color: var(--text); font-weight: 800; margin-left: 4px; }
.name { position: absolute; left: 0; top: 26px; font-size: 54px; font-weight: 800; letter-spacing: -0.035em; white-space: nowrap; }
.tabs { position: absolute; left: 352px; top: 20px; width: 700px; height: 54px; }
.tab-ind { position: absolute; left: 0; top: 0; width: 96px; height: 54px; background: var(--orange); }
.tab { position: absolute; top: 0; width: 96px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--text-2); }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--line-2); }
.tries { position: absolute; right: 0; top: 8px; text-align: right; font-size: 16px; color: var(--text-2); font-weight: 600; }
.tries b { display: block; font-size: 52px; color: var(--text); font-weight: 800; line-height: 1.1; }
.tries b small { font-size: 20px; color: var(--text-2); font-weight: 700; }

/* 카메라 */
.cam { position: absolute; left: 40px; top: 216px; width: 1000px; height: 640px; background: var(--feed); border: 2px solid rgba(234,88,12,.85); overflow: hidden; }
.cam svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam-veil { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(148,163,184,.06), rgba(0,0,0,0) 60%); }
.live { position: absolute; right: 64px; top: 26px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line-2); background: rgba(13,18,23,.85); font-size: 14px; font-weight: 700; letter-spacing: .12em; }
.live i { width: 8px; height: 8px; background: var(--orange); display: block; }
.feedinfo { position: absolute; left: 30px; bottom: 24px; font-size: 13px; color: var(--steel); letter-spacing: .02em; display: flex; gap: 18px; }
.feedinfo b { color: var(--text-2); font-weight: 500; }
.okbadge { position: absolute; left: 30px; top: 26px; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 9px; background: var(--green); color: #052E14; font-weight: 800; font-size: 17px; opacity: 0; }
.okbadge svg { position: static; width: 20px; height: 20px; }

/* 계기 열 */
.inst { position: absolute; left: 1064px; top: 216px; width: 496px; height: 640px; background: var(--panel); border: 1px solid var(--line); padding: 26px 24px; }
.msg { position: relative; height: 24px; font-size: 17px; font-weight: 700; }
.msg span { position: absolute; left: 0; top: 0; white-space: nowrap; }
.msg .judge { color: var(--orange); }
.msg .ok { color: var(--green); opacity: 0; }
.fingers { margin-top: 20px; display: flex; gap: 14px; align-items: flex-end; height: 84px; padding-bottom: 22px; position: relative; border-bottom: 1px solid var(--line); }
.f { position: relative; width: 36px; height: 56px; }
.f i { position: absolute; left: 9px; right: 9px; bottom: 0; height: 56px; background: var(--bone); transform-origin: 50% 100%; display: block; }
.f span { position: absolute; left: -6px; right: -6px; top: 62px; text-align: center; font-size: 13px; color: var(--text-2); font-weight: 700; white-space: nowrap; }
.mlabel { margin-top: 22px; display: flex; justify-content: space-between; font-size: 16px; color: var(--text-2); font-weight: 600; }
.mlabel .over { color: var(--green); font-weight: 700; opacity: 0; }
.big { margin-top: 2px; height: 128px; display: flex; align-items: baseline; font-weight: 800; letter-spacing: -0.05em; }
.big b { font-size: 128px; line-height: 1; width: 170px; text-align: right; font-weight: 800; }
.big small { font-size: 84px; line-height: 1; margin-left: 4px; font-weight: 800; }
.track { position: relative; margin-top: 14px; height: 14px; background: var(--raised); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--steel); transform-origin: 0 50%; }
.tau { position: absolute; left: 75%; top: -8px; width: 2px; height: 30px; background: var(--text); }
.taul { position: absolute; left: 75%; top: 26px; transform: translateX(-50%); font-size: 13px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
.frames { margin-top: 48px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text-2); font-weight: 600; }
.frames .lab { margin-right: auto; }
.fr { width: 34px; height: 14px; border: 1px solid var(--line-2); position: relative; }
.fr i { position: absolute; inset: 2px; background: var(--orange); opacity: 0; display: block; }
.grid { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.g { padding: 14px 0 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-2); font-weight: 600; position: relative; height: 70px; }
.g:nth-child(even) { padding-left: 18px; border-left: 1px solid var(--line); }
.g b { display: block; margin-top: 4px; font-size: 19px; color: var(--text); font-weight: 800; position: relative; height: 26px; }
.g b span { position: absolute; left: 0; top: 0; white-space: nowrap; }
.g .gr { color: var(--green); }
.g .cv { font-style: normal; }
.g .cv span { position: static; }
.picar { margin-top: 18px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--text-2); font-weight: 600; height: 30px; position: relative; }
.picar .pl { position: relative; flex: 1; height: 24px; }
.picar .pl span { position: absolute; left: 0; top: 2px; white-space: nowrap; color: var(--text); font-weight: 700; opacity: 0; }
.picar svg { width: 26px; height: 26px; fill: var(--text-2); }
</style>
</head>
<body>
<div id="root" data-composition-id="hero" data-start="0" data-width="1600" data-height="900" data-duration="12" data-fps="30">
  <div id="hero-stage" class="stage clip" data-start="0" data-duration="12">
    <div class="top">
      <div class="logo">SafeSign<i></i></div><div class="logo-sub">교육장 키트</div>
      <div class="steps"><span>로그인</span><span>과정</span><span class="on">시범·판정</span><span>결과</span><span>수료</span></div>
      <div class="status">
        <div class="cell">카메라<b>정상</b></div><div class="cell">AI Hand<b>정상</b></div><div class="cell">picar<b>정상</b></div>
        <div class="cell clock mono">11:53</div>
        <div class="cell"><span class="mono">SS-00001</span><b>김학습 님</b></div>
      </div>
    </div>

    <div class="head">
      <div class="pos">수신호 <span class="posbox" id="posn"></span><span class="of">/ 7</span></div>
      <div id="names"></div>
      <div class="tabs" id="tabs"><div class="tab-ind" id="tabind"></div></div>
      <div class="tries">시도<b>1<small> / 3회</small></b></div>
    </div>

    <div class="cam" id="cam">
      <div class="cam-veil"></div>
      <svg viewBox="0 0 1000 640" aria-hidden="true">
        <g fill="none" stroke="#94A3B8" stroke-width="2" opacity=".55">
          <path d="M18 56V18H56" /><path d="M944 18H982V56" /><path d="M18 584V622H56" /><path d="M944 622H982V584" />
        </g>
        <g id="ghost" opacity="0"></g>
        <g id="hand"><g id="bones"></g><g id="pulses"></g><g id="joints"></g></g>
      </svg>
      <div class="okbadge" id="okbadge"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>정답 확정</div>
      <div class="live mono"><i id="livedot"></i>LIVE</div>
      <div class="feedinfo mono"><span>CAM0 <b>Camera Module 3</b></span><span>1280×720</span><span><b>26</b> fps</span><span>frame <b id="frameno">4120</b></span></div>
    </div>

    <div class="inst">
      <div class="msg"><span class="judge" id="msgj">판정 중입니다. 손을 카메라에 보여 주세요.</span><span class="ok" id="msgok"></span></div>
      <div class="fingers" id="fingers"></div>
      <div class="mlabel"><span>일치율</span><span class="over" id="over">기준 이상</span></div>
      <div class="big"><b id="pct">94</b><small>%</small></div>
      <div class="track"><div class="fill" id="fill"></div><div class="tau"></div><div class="taul">판정 기준 75%</div></div>
      <div class="frames"><span class="lab">연속 확정</span><span class="fr"><i></i></span><span class="fr"><i></i></span><span class="fr"><i></i></span><span class="mono" style="margin-left:6px;color:#94A3B8">3 frames</span></div>
      <div class="grid">
        <div class="g">손 검출<b><span class="gr">검출</span></b></div>
        <div class="g">인식<b id="recog"></b></div>
        <div class="g">신뢰도<b><i class="cv"><span id="conf">94</span>%</i></b></div>
        <div class="g">판정 규칙<b><span>3프레임 연속, 75% 이상</span></b></div>
      </div>
      <div class="picar"><svg viewBox="0 0 256 256"><path d="M240,112H211.31L168,68.69A15.86,15.86,0,0,0,156.69,64H44.28A16,16,0,0,0,31,71.12L1.34,115.56A8.07,8.07,0,0,0,0,120v48a16,16,0,0,0,16,16H33a32,32,0,0,0,62,0h66a32,32,0,0,0,62,0h17a16,16,0,0,0,16-16V128A16,16,0,0,0,240,112ZM44.28,80H156.69l32,32H23ZM64,192a16,16,0,1,1,16-16A16,16,0,0,1,64,192Zm128,0a16,16,0,1,1,16-16A16,16,0,0,1,192,192Zm48-24H223a32,32,0,0,0-62,0H95a32,32,0,0,0-62,0H16V128H240Z"/></svg><span>picar</span><span class="pl" id="picar"></span></div>
    </div>
  </div>
</div>
<script>
(function () {
  const H = SAFESIGN_HAND, C = H.connections;
  const ALL = ["정지", "서행", "좌회전 유도", "우회전 유도", "확인 완료", "후진", "주의"];
  // 장면: 교육 순서대로 2-3-4번 신호. 일치율 목표는 시연 계정 수료증 값과 같다
  const SC = [
    { name: "서행", fingers: [0,1,1,0,0], pct: 89, picar: "감속 주행, 양쪽 황색 LED 점멸" },
    { name: "좌회전 유도", fingers: [1,1,0,0,0], pct: 93, picar: "좌회전 주행, 좌측 황색 LED 점멸" },
    { name: "우회전 유도", fingers: [1,0,0,0,1], pct: 94, picar: "우회전 주행, 우측 황색 LED 점멸" },
  ];
  const T = 4, N = SC.length;
  const NS = "http://www.w3.org/2000/svg";
  const BOX = { x: 270, y: 80, s: 480 };
  const pose = (n) => H.signals[n.replace(/ /g, "_")].map(([x, y]) => [BOX.x + x * BOX.s, BOX.y + y * BOX.s]);
  const fingerOf = (i) => (i === 0 ? -1 : Math.floor((i - 1) / 4));
  const boneF = ([a, b]) => (a === 0 || fingerOf(a) !== fingerOf(b) ? -1 : fingerOf(b));
  const lineStyle = (f, fingers) => (f >= 0 && fingers[f] ? { stroke: "#E2E8F0", strokeWidth: 4.5, opacity: 1 } : { stroke: "#64748B", strokeWidth: 3, opacity: 0.85 });
  const jointStyle = (i, fingers) => {
    const tip = i > 0 && i % 4 === 0 && fingers[i / 4 - 1];
    const up = i === 0 || fingers[fingerOf(i)];
    return tip ? { fill: "#F97316", r: 9 } : up ? { fill: "#E2E8F0", r: 6 } : { fill: "#64748B", r: 4.5 };
  };
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

  // 첫 프레임 = 마지막 장면이 끝난 상태 (끊김 없는 반복)
  const last = SC[N - 1], p0 = pose(last.name);
  const bones = C.map((c) => { const s = lineStyle(boneF(c), last.fingers); return el("line", { x1: p0[c[0]][0], y1: p0[c[0]][1], x2: p0[c[1]][0], y2: p0[c[1]][1], "stroke-linecap": "round", style: `stroke:${s.stroke};stroke-width:${s.strokeWidth}px;opacity:${s.opacity}` }, document.getElementById("bones")); });
  const ghost = C.map((c) => el("line", { x1: p0[c[0]][0], y1: p0[c[0]][1], x2: p0[c[1]][0], y2: p0[c[1]][1], stroke: "#94A3B8", "stroke-width": 2, "stroke-linecap": "round" }, document.getElementById("ghost")));
  const joints = p0.map((p, i) => { const s = jointStyle(i, last.fingers); return el("circle", { cx: p[0], cy: p[1], r: s.r, style: `fill:${s.fill}` }, document.getElementById("joints")); });
  const pulses = [4, 8, 12, 16, 20].map((i) => el("circle", { cx: p0[i][0], cy: p0[i][1], r: 9, fill: "none", stroke: "#22C55E", "stroke-width": 3, opacity: 0 }, document.getElementById("pulses")));

  // 신호 이름·번호·인식값·picar 문구는 겹쳐 두고 장면마다 바꿔 보인다
  const stack = (parentId, cls, texts, style) => texts.map((t, k) => { const s = document.createElement("span"); s.className = cls; s.textContent = t; s.style.cssText = style + (k === N - 1 ? "" : ";opacity:0"); document.getElementById(parentId).appendChild(s); return s; });
  const names = stack("names", "name", SC.map((s) => s.name), "");
  const posn = stack("posn", "n", SC.map((s) => String(ALL.indexOf(s.name) + 1)), "position:absolute;left:0;top:0");
  const recog = stack("recog", "", SC.map((s) => s.name), "");
  const oks = SC.map((s) => `정답입니다. picar가 ${s.name.replace(" 유도", "")}합니다.`);
  const picarL = stack("picar", "", SC.map((s) => s.picar), "");
  const tabs = ALL.map((n, i) => { const t = document.createElement("div"); t.className = "tab"; t.textContent = n; t.style.left = i * 100 + "px"; document.getElementById("tabs").appendChild(t); return t; });
  const tabInd = document.getElementById("tabind");
  const fingerBars = ["엄지", "검지", "중지", "약지", "소지"].map((n, i) => { const d = document.createElement("div"); d.className = "f"; d.innerHTML = `<i></i><span>${n}</span>`; document.getElementById("fingers").appendChild(d); return d.querySelector("i"); });
  const frames = Array.from(document.querySelectorAll(".fr i"));
  const pct = document.getElementById("pct"), conf = document.getElementById("conf"), fill = document.getElementById("fill");
  const cam = document.getElementById("cam");

  const tl = gsap.timeline({ paused: true });
  // 초기 상태
  gsap.set(tabInd, { x: ALL.indexOf(last.name) * 100 });
  tabs.forEach((t, i) => gsap.set(t, { color: i === ALL.indexOf(last.name) ? "#0F172A" : "#94A3B8" }));
  fingerBars.forEach((b, i) => gsap.set(b, { scaleY: last.fingers[i] ? 1 : 0.22, backgroundColor: last.fingers[i] ? "#E2E8F0" : "#475569" }));
  gsap.set(fill, { scaleX: last.pct / 100, backgroundColor: "#22C55E" });
  gsap.set("#over", { opacity: 1 });
  pct.textContent = last.pct; conf.textContent = last.pct;

  // 카메라 앞 손의 자연스러운 흔들림: 주기가 12초를 나누어 떨어지게 해서 반복 이음매가 없다
  tl.fromTo("#hand", { rotation: -0.8, x: -3, y: 0, svgOrigin: "510 580" }, { rotation: 0.8, x: 3, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
  tl.fromTo("#hand", { y: -3 }, { y: 3, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 0);
  tl.to("#livedot", { opacity: 0.25, duration: 0.5, ease: "steps(1)", yoyo: true, repeat: 23 }, 0);
  tl.fromTo("#frameno", { innerText: 4120 }, { innerText: 4432, snap: { innerText: 1 }, duration: 12, ease: "none" }, 0);

  SC.forEach((s, k) => {
    const S = k * T, prev = SC[(k + N - 1) % N], P = pose(s.name), PP = pose(prev.name);
    const ti = ALL.indexOf(s.name), pi = ALL.indexOf(prev.name);
    // 1) 이전 손모양 잔상 + 새 손모양으로 모핑
    C.forEach((c, j) => tl.set(ghost[j], { attr: { x1: PP[c[0]][0], y1: PP[c[0]][1], x2: PP[c[1]][0], y2: PP[c[1]][1] } }, S));
    tl.fromTo("#ghost", { opacity: 0.32 }, { opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, S);
    C.forEach((c, j) => {
      const st = lineStyle(boneF(c), s.fingers);
      tl.to(bones[j], { attr: { x1: P[c[0]][0], y1: P[c[0]][1], x2: P[c[1]][0], y2: P[c[1]][1] }, stroke: st.stroke, strokeWidth: st.strokeWidth, opacity: st.opacity, duration: 0.75, ease: "power3.inOut" }, S + 0.01 * j);
    });
    P.forEach((p, i) => {
      const st = jointStyle(i, s.fingers);
      tl.to(joints[i], { attr: { cx: p[0], cy: p[1], r: st.r }, fill: st.fill, duration: 0.75, ease: "power3.inOut" }, S + 0.012 * i);
    });
    [4, 8, 12, 16, 20].forEach((i, q) => tl.set(pulses[q], { attr: { cx: P[i][0], cy: P[i][1] } }, S + 1));
    // 2) 머리: 이름·번호 교체, 레지스터 표시 이동
    [names, posn, recog].forEach((arr) => {
      tl.to(arr[(k + N - 1) % N], { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, S + 0.05);
      tl.fromTo(arr[k], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, S + 0.3);
    });
    tl.to(tabInd, { x: ti * 100, duration: 0.6, ease: "power3.inOut" }, S + 0.05);
    tl.to(tabs[pi], { color: "#94A3B8", duration: 0.3 }, S + 0.1);
    tl.to(tabs[ti], { color: "#0F172A", duration: 0.3 }, S + 0.35);
    fingerBars.forEach((b, i) => tl.to(b, { scaleY: s.fingers[i] ? 1 : 0.22, backgroundColor: s.fingers[i] ? "#E2E8F0" : "#475569", duration: 0.5, ease: "power3.out" }, S + 0.35 + i * 0.04));
    // 3) 일치율: 손을 바꾸는 동안 떨어졌다가 판정 기준을 넘어 목표값까지 (실제 판정처럼 조금 흔들린다)
    const steps = [[38, S, 0.55, "power2.out"], [61, S + 0.7, 0.32, "power1.out"], [78, S + 1.02, 0.25, "power1.out"], [76, S + 1.27, 0.2, "sine.inOut"], [87, S + 1.47, 0.22, "power1.out"], [s.pct, S + 1.69, 0.24, "power2.out"]];
    steps.forEach(([v, at, d, e]) => {
      tl.to([pct, conf], { innerText: v, snap: { innerText: 1 }, duration: d, ease: e }, at);
      tl.to(fill, { scaleX: v / 100, duration: d, ease: e }, at);
    });
    tl.to(fill, { backgroundColor: "#64748B", duration: 0.2 }, S + 0.15);
    tl.to("#over", { opacity: 0, duration: 0.2 }, S + 0.15);
    tl.to(fill, { backgroundColor: "#22C55E", duration: 0.15 }, S + 1.2);
    tl.to("#over", { opacity: 1, duration: 0.2 }, S + 1.2);
    // 4) 같은 결과 3프레임 연속 → 확정
    frames.forEach((f, q) => tl.fromTo(f, { opacity: 0, backgroundColor: "#F97316" }, { opacity: 1, duration: 0.08, immediateRender: false }, S + 1.3 + q * 0.22));
    const V = S + 2.0;
    tl.to(frames, { backgroundColor: "#22C55E", duration: 0.15 }, V);
    tl.to(cam, { borderColor: "rgba(34,197,94,1)", duration: 0.2 }, V);
    tl.fromTo("#okbadge", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, V);
    tl.set("#msgok", { textContent: oks[k] }, V);
    tl.to("#msgj", { opacity: 0, duration: 0.15 }, V);
    tl.fromTo("#msgok", { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.3, immediateRender: false }, V + 0.05);
    tl.fromTo(picarL[k], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, V + 0.2);
    pulses.forEach((p, q) => { if (s.fingers[q]) tl.fromTo(p, { opacity: 0.9, attr: { r: 9 } }, { opacity: 0, attr: { r: 30 }, duration: 0.8, ease: "power2.out", immediateRender: false }, V + 0.02 * q); });
    // 5) 다음 신호 준비
    const R = S + 3.4;
    tl.to("#okbadge", { opacity: 0, duration: 0.3 }, R);
    tl.to(cam, { borderColor: "rgba(234,88,12,.85)", duration: 0.4 }, R);
    tl.to(frames, { opacity: 0, duration: 0.25 }, R);
    tl.to("#msgok", { opacity: 0, duration: 0.25 }, R);
    tl.to("#msgj", { opacity: 1, duration: 0.3 }, R + 0.2);
    tl.to(picarL[k], { opacity: 0, duration: 0.3 }, R);
  });
  window.__timelines["hero"] = tl;
})();
</script>
